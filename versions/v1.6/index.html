<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Daybook Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ring-bound planner on a desk. Divider tabs on top pick the section, month tabs down the right edge pick the month. */
:root{
  --desk:#D9E1D6; --paper:#FCFCF8; --ink:#2B302C; --muted:#6B746D; --line:#D3DACF; --rule:#E7EBE3; --dot:#D9DFD5;
  --accent:#4E7A57; --tab-ink:#2B302C;
  --t1:#C5DABF; --t2:#F1D2C1; --t3:#F1E1A6; --t4:#E8C5D2; --t5:#CEC7E9; --t6:#BCDAD0; --t7:#F3C7A5; --t8:#C6D5E6;
  --ring1:#E9ECEF; --ring2:#8E969E; --shadow:rgba(40,52,42,.28); --good:#3F7A4D; --bad:#B4473F;
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --body:"Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  --sec:var(--t1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1216; --paper:#191E24; --ink:#E5E7EA; --muted:#98A1AB; --line:#2B323A; --rule:#232930; --dot:#262C34;
  --accent:#E8B86C; --tab-ink:#E9ECEF;
  --t1:#3A5442; --t2:#5A4234; --t3:#5C5229; --t4:#573A48; --t5:#45406A; --t6:#2F5550; --t7:#6A4530; --t8:#34465E;
  --ring1:#5A626B; --ring2:#262B31; --shadow:rgba(0,0,0,.6); --good:#86C995; --bad:#EF8F86; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#0E1216; --paper:#191E24; --ink:#E5E7EA; --muted:#98A1AB; --line:#2B323A; --rule:#232930; --dot:#262C34;
  --accent:#E8B86C; --tab-ink:#E9ECEF;
  --t1:#3A5442; --t2:#5A4234; --t3:#5C5229; --t4:#573A48; --t5:#45406A; --t6:#2F5550; --t7:#6A4530; --t8:#34465E;
  --ring1:#5A626B; --ring2:#262B31; --shadow:rgba(0,0,0,.6); --good:#86C995; --bad:#EF8F86; color-scheme:dark;
}
/* themes the viewer can pick on the cover page */
.theme-sage{
  --desk:#D9E1D6; --paper:#FCFCF8; --ink:#2B302C; --muted:#6B746D; --line:#D3DACF; --rule:#E7EBE3; --dot:#D9DFD5;
  --accent:#4E7A57; --tab-ink:#2B302C;
  --t1:#C5DABF; --t2:#F1D2C1; --t3:#F1E1A6; --t4:#E8C5D2; --t5:#CEC7E9; --t6:#BCDAD0; --t7:#F3C7A5; --t8:#C6D5E6;
  --ring1:#E9ECEF; --ring2:#8E969E; --shadow:rgba(40,52,42,.28); --good:#3F7A4D; --bad:#B4473F; color-scheme:light;
}
.theme-blush{
  --desk:#EAD8D5; --paper:#FFFBFA; --ink:#3B2F31; --muted:#806C70; --line:#EAD9D6; --rule:#F4E9E7; --dot:#EEDCD9;
  --accent:#B04F6A; --tab-ink:#3B2F31;
  --t1:#F4C9D2; --t2:#F7D9C4; --t3:#F6E7B9; --t4:#EBC3DF; --t5:#D9CCF0; --t6:#CBE3D6; --t7:#F7C6B5; --t8:#CCD9F0;
  --ring1:#F2EDEC; --ring2:#A3908F; --shadow:rgba(90,50,55,.25); --good:#3F7A4D; --bad:#B4473F; color-scheme:light;
}
.theme-ocean{
  --desk:#CFDCE6; --paper:#FAFCFD; --ink:#1F2A35; --muted:#5F7080; --line:#D2DDE6; --rule:#E6EEF4; --dot:#D8E2EA;
  --accent:#2C6691; --tab-ink:#1F2A35;
  --t1:#BFD8EC; --t2:#C6E6E0; --t3:#E8E3B8; --t4:#D7CDEB; --t5:#B9CFE8; --t6:#BFE3D2; --t7:#F2D2B8; --t8:#CAD7E3;
  --ring1:#ECF0F3; --ring2:#87949F; --shadow:rgba(30,50,70,.28); --good:#2F7A55; --bad:#B4473F; color-scheme:light;
}
.theme-linen{
  --desk:#E2DCD2; --paper:#FFFDF9; --ink:#2C2925; --muted:#776F66; --line:#E3DCD1; --rule:#EFEAE2; --dot:#E6E0D6;
  --accent:#6A5689; --tab-ink:#2C2925;
  --t1:#DCD3C3; --t2:#D9C9C0; --t3:#E7DDBF; --t4:#D9C5C9; --t5:#CFC9D9; --t6:#C9D3C6; --t7:#E2CDB8; --t8:#C8CED6;
  --ring1:#EEEBE6; --ring2:#958D82; --shadow:rgba(60,50,40,.26); --good:#4C7A45; --bad:#AE4A3E; color-scheme:light;
}
/* dark styles */
.dark-midnight{
  --desk:#0E1216; --paper:#191E24; --ink:#E5E7EA; --muted:#98A1AB; --line:#2B323A; --rule:#232930; --dot:#262C34;
  --accent:#E8B86C; --tab-ink:#E9ECEF;
  --t1:#3A5442; --t2:#5A4234; --t3:#5C5229; --t4:#573A48; --t5:#45406A; --t6:#2F5550; --t7:#6A4530; --t8:#34465E;
  --ring1:#5A626B; --ring2:#262B31; --shadow:rgba(0,0,0,.6); --good:#86C995; --bad:#EF8F86; color-scheme:dark;
}
.dark-charcoal{
  --desk:#121314; --paper:#1D1E20; --ink:#E8E8E6; --muted:#9E9E99; --line:#303134; --rule:#27282A; --dot:#2B2C2F;
  --accent:#9CC7A4; --tab-ink:#ECECEA;
  --t1:#3D4A40; --t2:#4E4036; --t3:#514B30; --t4:#4D3B44; --t5:#403D5A; --t6:#2F4A46; --t7:#573F2E; --t8:#36404E;
  --ring1:#6A6D71; --ring2:#2A2C2E; --shadow:rgba(0,0,0,.6); --good:#9CC7A4; --bad:#EF8F86; color-scheme:dark;
}
.dark-forest{
  --desk:#0C1310; --paper:#16201B; --ink:#E3ECE6; --muted:#93A69A; --line:#26352D; --rule:#1F2C25; --dot:#22302A;
  --accent:#B5DB8E; --tab-ink:#E8F0EA;
  --t1:#2F5040; --t2:#4F4430; --t3:#4A5228; --t4:#4F3A3E; --t5:#3B3F5E; --t6:#295049; --t7:#5E4128; --t8:#2E4552;
  --ring1:#5E6B63; --ring2:#23302A; --shadow:rgba(0,0,0,.6); --good:#B5DB8E; --bad:#F0918A; color-scheme:dark;
}
.dark-plum{
  --desk:#141018; --paper:#1E1824; --ink:#EDE6F0; --muted:#A99DB2; --line:#33293C; --rule:#2A2232; --dot:#2E2537;
  --accent:#EBA9CB; --tab-ink:#F1EAF4;
  --t1:#4A3A5C; --t2:#5C3E46; --t3:#594B2F; --t4:#5B3554; --t5:#3E3F6B; --t6:#2E4F57; --t7:#66432F; --t8:#3A4562;
  --ring1:#6C6273; --ring2:#2B2331; --shadow:rgba(0,0,0,.6); --good:#93CFA0; --bad:#F2938C; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100%;background:var(--desk);color:var(--ink);padding-block:14px 30px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.binder{max-width:1480px;margin:0 auto;padding-right:16px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:0 0 10px 52px}
.brand{margin-right:auto;border:0;background:none;padding:3px;border-radius:12px;display:inline-flex;align-items:center;line-height:0}
.brand svg{width:44px;height:44px;display:block}
.brand:hover svg{transform:rotate(-4deg)}
.brand svg{transition:transform .15s}
.brand{gap:10px;min-width:0;max-width:100%;color:var(--ink)}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:10px;display:block;flex:none}
.brand .bt{font:700 28px/1.1 var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:4px}
.logorow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logoprev{width:72px;height:72px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;flex:none;background:var(--paper)}
.logoprev img,.logoprev svg{width:56px;height:56px;object-fit:contain;display:block}
label.btn{display:inline-block;cursor:pointer}
.hint.err{color:var(--bad)}
.gsetup{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.gsetup details{font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.gsetup summary{cursor:pointer;font-weight:600;color:var(--accent)}
.steps{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.steps a{color:var(--accent)}
.steps code{font:500 12.5px var(--mono);background:var(--rule);padding:1px 5px;border-radius:4px;word-break:break-all}
.rz{border:1.5px solid var(--bad);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb, var(--bad) 7%, var(--paper))}
.rz p{margin:0;font-size:14px}
.rz label.row{font-size:14px;align-items:flex-start}
.rz #rz-type{font:600 16px var(--mono);letter-spacing:.1em}
.dangerbtn{border:1px solid var(--bad);background:var(--bad);color:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.dangerbtn:disabled{opacity:.4;cursor:not-allowed}
.clogo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 10px}
.yearsw{display:flex;align-items:center;gap:4px}
.yearsw span{font:24px/1 var(--serif);min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.iconb{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;font-size:17px;line-height:1}
.iconb:hover{border-color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.status{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.status.ok::before{background:var(--good)} .status.err{color:var(--bad)} .status.err::before{background:var(--bad)}

/* divider tabs */
.toptabs{display:flex;gap:4px;align-items:flex-end;padding-left:52px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.ttab{flex:none;border:0;background:var(--c);color:var(--tab-ink);border-radius:12px 12px 0 0;padding:9px 16px 9px;font-weight:600;font-size:14px;white-space:nowrap;
  transform:translateY(5px);transition:transform .15s, padding .15s;box-shadow:inset 0 -6px 8px -8px var(--shadow)}
.ttab:hover{transform:translateY(2px)}
.ttab[aria-current="page"]{transform:none;padding-bottom:13px;box-shadow:none}
.ttab.cover{background:var(--paper);color:var(--accent);font-family:var(--hand);font-size:20px;line-height:1;padding-block:7px 8px}
.ttab.cover[aria-current="page"]{padding-bottom:12px}

/* the book */
.book{display:grid;grid-template-columns:40px minmax(0,1fr) 50px;background:var(--paper);border-radius:6px 16px 16px 6px;position:relative;
  box-shadow:0 1px 0 var(--line), 0 22px 44px -24px var(--shadow), 0 2px 6px -2px var(--shadow)}
.book::before{content:"";position:absolute;inset:0 auto 0 40px;width:1px;background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 11px)}
.rings{display:flex;flex-direction:column;justify-content:space-evenly;align-items:flex-start;padding-block:26px}
.rings span{display:block;width:40px;height:11px;margin-left:-20px;border-radius:7px;
  background:linear-gradient(var(--ring1), var(--ring2) 55%, var(--ring1));box-shadow:0 2px 3px -1px var(--shadow)}
.rings span::after{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--desk);margin:1.5px 0 0 26px;box-shadow:inset 0 1px 2px var(--shadow)}
main.page{min-width:0;padding:30px clamp(16px,3vw,38px) 40px;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.4px);background-size:22px 22px;background-position:11px 11px}
.sidetabs{display:flex;flex-direction:column;gap:3px;padding-block:22px}
.stab{flex:1;min-height:30px;border:0;background:var(--c);color:var(--tab-ink);border-radius:0 10px 10px 0;margin-right:-14px;
  font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;transform:translateX(-6px);transition:transform .15s;box-shadow:inset 6px 0 8px -8px var(--shadow)}
.stab:hover{transform:translateX(-2px)}
.stab[aria-current="true"]{transform:translateX(4px);box-shadow:none}

/* page furniture */
.ph{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:22px;border-bottom:2px dotted var(--line)}
.ph::before{content:"";position:absolute;top:-44px;left:-6px;width:118px;height:26px;transform:rotate(-4deg);opacity:.9;
  background:repeating-linear-gradient(135deg, var(--sec) 0 9px, color-mix(in srgb, var(--sec) 55%, var(--paper)) 9px 18px);
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 4px calc(100% - 4px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 4px calc(100% - 4px),transparent 100%)}
.ph h1{margin:0;font:400 clamp(30px,3.6vw,44px)/1.02 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.ph .nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lbl{font:700 22px/1 var(--hand);color:var(--accent);margin:0 0 6px}
.cap{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:22px}

/* paper fields */
input.ln,select.ln{width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:7px 2px;border-radius:0}
input.ln:focus,select.ln:focus{outline:none;border-bottom-color:var(--accent)}
input.ln::placeholder,textarea::placeholder{color:var(--muted);opacity:.65}
textarea.ta{display:block;width:100%;border:1px solid var(--line);border-radius:10px;color:inherit;font:inherit;line-height:28px;padding:0 10px;resize:vertical;
  background:var(--paper) repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px);background-attachment:local}
textarea.ta:focus{outline:none;border-color:var(--accent)}
.ck{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--paper);color:var(--muted);font-weight:600;font-size:13px}
.chipb[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:var(--tab-ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--paper);color:var(--accent)}
.xb{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:30px;height:30px;border-radius:6px}
.xb:hover{color:var(--bad);background:var(--rule)}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1.5px dashed var(--line);border-radius:12px;background:var(--paper)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.panel{display:flex;flex-direction:column;gap:20px;padding:20px;border-radius:14px;background:color-mix(in srgb, var(--sec) 32%, var(--paper));position:relative}
.panel textarea.ta{background-color:var(--paper)}

.sec-cover{--sec:var(--t2)} .sec-year{--sec:var(--t1)} .sec-month{--sec:var(--t2)} .sec-week{--sec:var(--t3)} .sec-day{--sec:var(--t4)}
.sec-goals{--sec:var(--t5)} .sec-budget{--sec:var(--t6)} .sec-fitness{--sec:var(--t7)} .sec-notes{--sec:var(--t8)}

/* stickers */
.stk{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:7px;background:var(--c);color:var(--tab-ink);
  font:700 12px/1.2 var(--body);white-space:nowrap;box-shadow:0 1px 2px var(--shadow);transform:rotate(-2deg)}
.stk:nth-child(even){transform:rotate(1.5deg)}
.stk::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--tab-ink);opacity:.45}
.stray{display:flex;flex-wrap:wrap;gap:8px}
.stray button{border:0;padding:0;background:none}
.stray button .stk{opacity:.42;transform:none;box-shadow:none}
.stray button[aria-pressed="true"] .stk{opacity:1;box-shadow:0 1px 3px var(--shadow);transform:rotate(-2deg)}
.stks{display:flex;flex-wrap:wrap;gap:3px}
.stks .stk{font-size:10px;padding:2px 6px 2px 5px;border-radius:5px}
.stks .stk::before{width:5px;height:5px}

/* cover */
.coverg{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
.coverbook{aspect-ratio:3/4;max-width:100%;border-radius:8px 18px 18px 8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 26px 40px -24px var(--shadow), 0 2px 6px var(--shadow);border:1px solid var(--line);background:var(--paper)}
.coverbook::after{content:"";position:absolute;inset:0 auto 0 0;width:18px;background:linear-gradient(90deg, rgba(0,0,0,.14), transparent)}
.clabel{position:relative;z-index:1;background:var(--paper);border-radius:10px;padding:22px 26px;text-align:center;width:72%;box-shadow:0 4px 14px -6px var(--shadow);border:1px solid var(--line)}
.clabel .ct{font:400 30px/1.05 var(--serif);word-break:break-word}
.clabel .cy{font:700 40px/1 var(--hand);color:var(--accent);margin-top:6px}
.clabel .cs{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.cv-garden{background:
  radial-gradient(circle at 18% 22%, var(--t1) 0 14%, transparent 14.5%),
  radial-gradient(circle at 84% 14%, var(--t4) 0 11%, transparent 11.5%),
  radial-gradient(circle at 78% 82%, var(--t6) 0 17%, transparent 17.5%),
  radial-gradient(circle at 14% 86%, var(--t2) 0 12%, transparent 12.5%),
  radial-gradient(circle at 50% 104%, var(--t3) 0 20%, transparent 20.5%),
  radial-gradient(circle at 52% -6%, var(--t5) 0 15%, transparent 15.5%), var(--paper)}
.cv-stripes{background:repeating-linear-gradient(115deg, var(--t2) 0 22px, var(--paper) 22px 34px, var(--t4) 34px 56px, var(--paper) 56px 68px)}
.cv-arches{background:
  radial-gradient(circle at 50% 112%, var(--t7) 0 18%, var(--paper) 18% 21%, var(--t3) 21% 33%, var(--paper) 33% 36%, var(--t2) 36% 48%, var(--paper) 48% 51%, var(--t1) 51% 63%, transparent 63%), var(--paper)}
.cv-grid{background:linear-gradient(var(--line) 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/24px 24px, var(--t8)}
.cv-confetti{background:
  radial-gradient(circle, var(--t4) 0 4px, transparent 4.5px) 0 0/58px 58px,
  radial-gradient(circle, var(--t6) 0 3px, transparent 3.5px) 20px 31px/58px 58px,
  radial-gradient(circle, var(--t3) 0 5px, transparent 5.5px) 39px 12px/58px 58px,
  radial-gradient(circle, var(--t5) 0 2.5px, transparent 3px) 11px 45px/58px 58px, var(--paper)}
.cv-solid{background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--accent) 80%, var(--paper)), var(--accent))}
.index{display:flex;flex-direction:column}
.index button{display:flex;align-items:baseline;gap:10px;border:0;background:none;padding:9px 0;text-align:left;font-size:16px;font-weight:600;border-bottom:1px solid var(--rule)}
.index button i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none;align-self:center}
.index button .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.index button .pg{font:500 13px var(--mono);color:var(--muted)}
.index button:hover{color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.sw{border:2px solid transparent;border-radius:12px;padding:4px;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.sw[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.sw .swc{width:56px;height:40px;border-radius:8px;border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.sw .swc b{display:block}
.sw .cvt{width:44px;height:58px;border-radius:4px 8px 8px 4px;border:1px solid var(--line)}

/* year */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:20px 18px}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.mini h3{margin:-10px -10px 8px;padding:6px 10px;background:var(--c);border-radius:11px 11px 0 0}
.mini h3 button{border:0;background:none;padding:0;font:400 18px var(--serif);color:var(--tab-ink)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.mg .dw{font:600 10px var(--body);color:var(--muted);padding-bottom:2px}
.mg button{position:relative;border:0;background:none;aspect-ratio:1;border-radius:50%;font:500 11.5px var(--mono);padding:0}
.mg button:hover{background:var(--rule)}
.mg .we{color:var(--muted)}
.mg .hol{color:var(--accent);font-weight:700}
.mg .has::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mg .today{background:var(--accent);color:var(--paper)} .mg .today::after{background:var(--paper)}
.word input{font:400 28px var(--serif)}

/* month */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:26px;align-items:start}
.dowh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sec);border-radius:10px 10px 0 0;color:var(--tab-ink);font:700 11px var(--body);letter-spacing:.09em;text-transform:uppercase}
.dowh span{padding:7px 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);background:var(--paper)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:112px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.blank{background:repeating-linear-gradient(135deg, transparent 0 6px, var(--rule) 6px 7px)}
.cell .dn{display:flex;align-items:center;gap:6px;min-width:0}
.cell .dn button{border:0;background:none;padding:2px 6px;border-radius:999px;font:600 13px var(--mono)}
.cell .dn button:hover{background:var(--rule)}
.cell.today .dn button{background:var(--accent);color:var(--paper)}
.cell .hn{font:700 15px/1 var(--hand);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell textarea{flex:1;width:100%;border:0;background:transparent;resize:none;font:13px/1.35 var(--body);color:inherit;padding:2px;min-height:44px}
.cell textarea:focus{outline:none;background:var(--rule);border-radius:4px}

/* week */
.wkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.dbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.dbox header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 -12px;padding:7px 12px;background:color-mix(in srgb, var(--sec) 55%, var(--paper))}
.dbox.today header{background:var(--sec)}
.dbox header button{border:0;background:none;padding:0;text-align:left;font:400 18px var(--serif);color:var(--ink)}
.dbox header span{font:500 12px var(--mono);color:var(--muted)}
.dbox ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.dbox.focus{background:color-mix(in srgb, var(--sec) 30%, var(--paper));border-style:dashed;padding-top:12px}
.dbox.focus textarea.ta{background-color:var(--paper)}

/* day */
.dayg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:start}
.sched{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.sched .t{font:500 12px var(--mono);color:var(--muted);border-bottom:1px solid var(--rule);padding:8px 0 7px}
.sched .t.now{color:var(--accent);font-weight:700}
.sched input.ln{border-bottom-color:var(--rule)}
.pri .n{font:700 24px/1 var(--hand);color:var(--accent);width:18px;text-align:center}
.pri input.ln{font-weight:600}
.done input.ln{text-decoration:line-through;color:var(--muted)}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.goal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal .gt{display:flex;align-items:center;gap:8px}
.goal .gt b{font:700 26px/1 var(--hand);color:var(--accent)}
.goal .gt input{font:400 20px var(--serif)}
.goal .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{display:flex;align-items:center;gap:10px}
.prog input{flex:1;accent-color:var(--accent)}
.prog output{font:600 13px var(--mono);min-width:4ch;text-align:right}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%}
.habits th,.habits td{border-bottom:1px solid var(--rule);text-align:center;padding:5px 2px}
.habits thead th{font:500 11px var(--mono);color:var(--tab-ink);min-width:26px;background:var(--sec)}
.habits td.we{background:var(--rule)}
.habits .hn{position:sticky;left:0;background:var(--paper);min-width:170px;text-align:left;padding-left:10px;z-index:1;border-right:1px solid var(--line)}
.habits thead .hn{background:var(--sec)}
.habits .hp{font:600 12px var(--mono);min-width:52px;padding-right:10px;text-align:right;color:var(--accent)}
.habits .ck{width:17px;height:17px}

/* budget */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:12px;background:color-mix(in srgb, var(--sec) 40%, var(--paper));border:1px solid color-mix(in srgb, var(--sec) 70%, var(--paper))}
.stat .v{font:500 21px var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.btbl th{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tab-ink);text-align:left;padding:8px 6px;background:var(--sec)}
.btbl td{padding:0 6px;border-bottom:1px solid var(--rule)}
.btbl td input.ln{border-bottom:0}
.btbl .num,.btbl .num input{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.btbl .num{width:110px}
.btbl .x{width:34px;text-align:center}
.btbl tfoot td{font-weight:700;padding:10px 6px;border-bottom:0;border-top:2px dotted var(--line)}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tbar .lbl{margin:0}

/* fitness */
.fform{display:grid;grid-template-columns:150px 140px 100px 100px minmax(0,1fr) auto;gap:10px;align-items:end;padding:16px;border-radius:14px;background:color-mix(in srgb, var(--sec) 32%, var(--paper))}
.fform label{display:flex;flex-direction:column;gap:2px;min-width:0}
.fform label span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bars{display:flex;gap:12px;align-items:flex-end;height:160px;padding:18px 14px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:64px;background:var(--sec);border:1px solid color-mix(in srgb, var(--sec) 60%, var(--ink));border-bottom:0;border-radius:7px 7px 0 0;min-height:2px}
.bar span{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.bar b{font:600 12px var(--mono)}
.ftbl td,.ftbl th{padding:8px 8px;border-bottom:1px solid var(--rule);text-align:left;font-size:14px}
.ftbl th{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tab-ink);background:var(--sec)}

/* notes */
.notes{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.nlist{display:flex;flex-direction:column;gap:7px}
.nitem{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;background:var(--paper);text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.nitem[aria-current="true"]{border-color:var(--accent);border-left-color:var(--c);box-shadow:0 0 0 1px var(--accent)}
.nitem b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem span{font-size:12px;color:var(--muted)}
.neditor{display:flex;flex-direction:column;gap:14px;min-width:0}
.neditor .nt input{font:400 26px var(--serif)}
.nmeta{display:grid;grid-template-columns:180px 180px 1fr;gap:12px;align-items:end}
.nmeta label{display:flex;flex-direction:column;gap:2px}
.danger{border:1px solid var(--bad);color:var(--bad);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;justify-self:end}
.danger.armed{background:var(--bad);color:var(--paper)}

/* home dashboard */
.sec-home{--sec:var(--t6)}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;grid-column:span 6}
.dc.s4{grid-column:span 4} .dc.s5{grid-column:span 5} .dc.s7{grid-column:span 7} .dc.s8{grid-column:span 8} .dc.s12{grid-column:span 12}
.dch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dch h2{margin:0;font:700 23px/1 var(--hand);color:var(--ink);display:flex;align-items:center;gap:8px}
.dch h2::before{content:"";width:10px;height:18px;border-radius:3px;background:var(--c, var(--sec))}
.dch button{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0;white-space:nowrap}
.big{font:400 40px/1 var(--serif)}
.kpis{display:flex;gap:10px 22px;flex-wrap:wrap}
.kpi .cap{display:block}
.kpi .v{font:500 20px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:118px;height:118px;flex:none}
.ring .trk{stroke:var(--rule)} .ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font:500 20px var(--mono)} .ring .rs{fill:var(--muted);font:600 10px var(--body);letter-spacing:.08em}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13.5px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{position:relative;height:10px;border-radius:5px;background:var(--rule)}
.hb .tr i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent);min-width:2px}
.hb .tr.pair{height:16px;background:none;display:flex;flex-direction:column;gap:2px}
.hb .tr.pair i{position:relative;inset:auto;height:7px}
.hb .tr.pair i.pl{background:color-mix(in srgb, var(--accent) 32%, var(--paper));outline:1px solid color-mix(in srgb, var(--accent) 45%, var(--paper));outline-offset:-1px}
.hb .tr.pair i.over{background:var(--bad)}
.hb .vl{font:500 12.5px var(--mono);color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;border-radius:3px;background:var(--accent)}
.legend i.pl{background:color-mix(in srgb, var(--accent) 32%, var(--paper));outline:1px solid color-mix(in srgb, var(--accent) 45%, var(--paper));outline-offset:-1px}
.legend i.over{background:var(--bad)}
.meter{height:14px;border-radius:7px;background:var(--rule);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--accent);border-radius:7px}
.meter i.over{background:var(--bad)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch .grid{stroke:var(--rule);stroke-width:1}
svg.ch .base{stroke:var(--line);stroke-width:1}
svg.ch .ax{fill:var(--muted);font:500 11px var(--mono)}
svg.ch .bar{fill:var(--accent)}
svg.ch .bar.cur{fill:var(--accent)} svg.ch .bar.dim{fill:color-mix(in srgb, var(--accent) 45%, var(--paper))}
svg.ch .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.ch .area{fill:color-mix(in srgb, var(--accent) 14%, transparent)}
svg.ch .pt{fill:var(--accent);stroke:var(--paper);stroke-width:2}
svg.ch .lab{fill:var(--ink);font:600 12px var(--mono)}
svg.ch .hit{fill:transparent}
.todo-mini{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.todo-mini li{display:flex;gap:8px;align-items:baseline}
.todo-mini li b{font:700 20px/1 var(--hand);color:var(--accent);width:14px}
.todo-mini li.dn span{text-decoration:line-through;color:var(--muted)}
.upc{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.upc li{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px;align-items:center;font-size:13.5px}
.upc li .d{font:500 12px var(--mono);color:var(--muted)}
.dempty{color:var(--muted);font-size:13.5px;padding:14px;border:1.5px dashed var(--line);border-radius:10px}
.dempty button{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);font:500 12.5px/1.35 var(--body);padding:6px 9px;border-radius:7px;max-width:240px;box-shadow:0 6px 18px -6px var(--shadow)}

/* customize menu */
.cbtn{display:inline-flex;align-items:center;gap:6px}
.cbtn svg{width:16px;height:16px}
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb, var(--ink) 38%, transparent)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(400px,100%);background:var(--paper);color:var(--ink);overflow-y:auto;
  box-shadow:-20px 0 40px -20px var(--shadow);display:flex;flex-direction:column;gap:22px;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;
  animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer header h2{margin:0;font:400 28px var(--serif)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;border-radius:999px;background:none;padding:8px 0;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* google calendar events */
.ev{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:12.5px;line-height:1.3;padding:3px 7px 3px 6px;border-radius:6px;text-decoration:none;color:var(--ink);
  background:color-mix(in srgb, var(--ec, var(--accent)) 18%, var(--paper));border-left:3px solid var(--ec, var(--accent))}
a.ev:hover{background:color-mix(in srgb, var(--ec, var(--accent)) 28%, var(--paper))}
.ev b{font:500 11px var(--mono);color:var(--muted);flex:none}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev.all{font-weight:600}
.ev.lg{font-size:14px;padding:7px 10px;border-left-width:4px;flex-wrap:wrap}
.ev.lg b{font-size:12px}
.ev.lg em{font-style:normal;font-size:12px;color:var(--muted);flex-basis:100%}
.evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cell .more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.cell .ev{font-size:11.5px;padding:2px 5px}
.cell .ev b{display:none}
.sched{align-items:stretch}
.sched .t{padding-top:10px}
.sched .slot{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:4px;border-bottom:1px solid var(--rule)}
.sched .slot input.ln{border-bottom:0}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--line);background:var(--paper);font-size:13.5px}
.gbar .gtext{flex:1;min-width:12em;color:var(--muted)}
.gicon{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--paper);font:700 13px var(--mono)}
.gstat{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.gstat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.gstat.ok::before{background:var(--good)} .gstat.warn::before{background:var(--bad)}
.calrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.calrow i{width:12px;height:12px;border-radius:3px;background:var(--ec, var(--accent));flex:none}
.calrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* activity blocks */
.btray-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:8px 0 10px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.btray{display:flex;flex-wrap:wrap;gap:8px}
.blk-src{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:9px 13px 9px 10px;background:var(--c);color:var(--tab-ink);font-weight:700;font-size:14px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;box-shadow:0 1px 2px var(--shadow)}
.blk-src svg,.blk svg{width:18px;height:18px;flex:none}
.blk-src[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.blk{display:flex;align-items:center;gap:7px;border:0;width:100%;text-align:left;border-radius:8px;padding:6px 10px;background:var(--c);color:var(--tab-ink);font-size:14px;font-weight:600;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;min-width:0}
.blk b{font:500 12px var(--mono);opacity:.85;flex:none}
.blk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:none;max-width:60%}
.blk em{font-style:normal;font-weight:400;font-size:12.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.blk.sm{font-size:12.5px;padding:3px 8px;cursor:default;touch-action:auto;border-radius:6px}
.blk.sm svg{width:14px;height:14px}
.blk.sm b{font-size:11px}
.blk.moving{opacity:.35}
.tgrid{position:relative;--hh:56px;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:46px minmax(0,1fr);height:var(--hh);border-bottom:1px solid var(--rule);box-sizing:border-box}
.trow:last-of-type{border-bottom:0}

async function dAuth(consent){

  if(!G.tc || G.tcId !== cid){
    G.tcId = cid;
    G.tc = google.accounts.oauth2.initTokenClient({ client_id: cid, scope: GSCOPE,
      callback: async resp => {
        if(resp.error){ G.state = gOn() ? "needs_tap" : "off"; G.msg = resp.error==="access_denied" ? "Google sign-in was cancelled. Tap to try again." : `Google sign-in didn't finish (${resp.error}).`; paintG(); softRender(); return; }
        G.tok = { access_token: resp.access_token, exp: Date.now() + (Number(resp.expires_in) || 3600) * 1000 }; saveTok();
        if(!gOn()){ const doc = clone(get("settings")); doc.gcalOn = true; put("settings", doc); toast("Google Calendar connected"); }

async function dFetch(path, params){
  const u = new URL("https://www.googleapis.com/calendar/v3/" + path);

  let r;
  try { r = await fetch(u.toString(), { headers: { Authorization: "Bearer " + G.tok.access_token } }); }
  catch(e){ throw { code: "offline" }; }
  if(r.status === 401){ G.tok = null; saveTok(); throw { code: "expired" }; }
  if(!r.ok){ let m = ""; try { m = (await r.json()).error.message; } catch(e) {} throw { code: "http", status: r.status, message: m }; }
  return r.json();
}

  else if(e.status === 403){ G.state = "error"; G.msg = "Google refused the request" + (e.message ? ": " + e.message : ".") + " Check that the Google Calendar API is turned on in your Google Cloud project."; }

async function dSync(force){

  dBusy = true;
  try {
    const hid = gHidden(), cals = (G.cals.length ? G.cals.filter(c => !hid.has(c.id)) : [{ id: "primary" }]).slice(0, 12);
    const months = [...gNeededMonths()], fresh = 5*60*1000;
    let changed = false;
    for(const mkey of months) for(const c of cals){
      const key = mkey + "|" + c.id;
      if(!force && G.dLast[key] && Date.now() - G.dLast[key] < fresh) continue;
      const w = gWindow(mkey);
      const j = await dFetch(`calendars/${encodeURIComponent(c.id)}/events`, { timeMin: w.from.toISOString(), timeMax: w.to.toISOString(), singleEvents: "true", orderBy: "startTime", maxResults: "2500", timeZone: TZ });
      G.byWatch[key] = parseEvents(j, { id: c.id, color: c.color }) || [];

    }
    Object.keys(G.byWatch).forEach(k => { const [mk0, cid] = k.split("|"); if(!months.includes(mk0) || (cid && hid.has(cid))) delete G.byWatch[k]; });
    if(changed){ G.updated = Date.now(); G.state = "ok"; G.msg = ""; gRebuild(); saveGCache(); paintG(); softRender(); }

  finally { dBusy = false; }

function columns(vals, labels, opts={}){
  const W = 600, H = 210, L = 44, R = 8, T = 22, B = 26, iw = W-L-R, ih = H-T-B, n = vals.length;

  vals.forEach((v,i) => {

function line(vals, labels, opts={}){

  let g = "";

  });
  vals.forEach((v,i) => { if(v!=null) g += `<rect class="hit" x="${X(i)-slot/2}" y="${T}" width="${slot}" height="${ih}" data-tip="${esc(opts.tip(i,v))}"/>`; });

  const todos = (tdoc.todo||[]).filter(t => t && t.t && t.t.trim()), done = todos.filter(t=>t.done).length;
  const tst = dayStickers(ymd(td));

  const yearBody = `<div class="ringwrap">${ring(elapsed/yl, Math.round(elapsed/yl*100)+"%", "OF "+y)}<div class="stack" style="gap:8px"><div><span class="cap">Days left</span><div class="big">${yl-elapsed}</div></div><div class="muted" style="font-size:13px">Week ${isThisYear?weekNo(td):"–"} · Day ${elapsed} of ${yl}</div></div></div>`;

  const goalsBody = goals.length ? `<div class="kpis"><div class="kpi"><span class="cap">Average progress</span><div class="v">${avg}%</div></div><div class="kpi"><span class="cap">Goals</span><div class="v">${goals.length}</div></div></div>`
    + hbars(goals.map(({g}) => ({label:g.title, value:Number(g.progress||0), max:100, text:(g.progress||0)+"%", tip:`${g.title}: ${g.progress||0}% done${g.due?` · due ${g.due}`:""}`})))
    : dempty(`No goals set for ${y} yet.`, "goals", "Set your goals");

  let habBody;
  if(habits.length){
    const rows = habits.map(h => { const c = Object.entries(h.days||{}).filter(([d,v]) => v && +d<=daysSoFar).length; return {label:h.name, value:c, max:daysSoFar, text:`${c}/${daysSoFar}`, tip:`${h.name}: ${c} of ${daysSoFar} days (${Math.round(c/daysSoFar*100)}%)`}; });
    const tot = rows.reduce((a,r)=>a+r.value,0), pct = tot/(daysSoFar*rows.length);
    habBody = `<div class="ringwrap">${ring(pct, Math.round(pct*100)+"%", MON3[m].toUpperCase())}<div style="flex:1;min-width:0">${hbars(rows)}</div></div>`;

    const exps = (bdoc.expenses||[]).filter(r => r && r.cat && (num(r.plan)||num(r.act))).map(r => ({cat:r.cat, plan:num(r.plan), act:num(r.act)}));
    const act = exps.reduce((a,e)=>a+e.act,0), plan = exps.reduce((a,e)=>a+e.plan,0);
    const mx = Math.max(1, ...exps.map(e => Math.max(e.plan, e.act)));

      ${top.length?`<div class="legend"><span><i class="pl"></i>Planned</span><span><i></i>Actual</span><span><i class="over"></i>Over plan</span></div>
      <div class="hbars">${top.map(e => `<div class="hb" data-tip="${esc(`${e.cat}: ${money(e.act)} of ${money(e.plan)} planned`)}"><span class="nm">${esc(e.cat)}</span><span class="tr pair"><i class="pl" style="width:${Math.max(1,e.plan/mx*100).toFixed(1)}%"></i><i class="${e.act>e.plan&&e.plan>0?"over":""}" style="width:${Math.max(1,e.act/mx*100).toFixed(1)}%"></i></span><span class="vl">${shortMoney(e.act)}/${shortMoney(e.plan)}</span></div>`).join("")}</div>`:""}`;
  } else budBody = dempty(`No budget for ${MONTHS[m]} yet.`, "budget", "Plan it");

  // debt across the year
  const debt = MON3.map((_,i) => { const d = store.get("b"+mk(y,i)); if(!d) return null; const tot = (d.debts||[]).reduce((a,r)=>a+num(r&&r.bal),0); return tot>0 ? tot : null; });

  const debtBody = dpts.length ? `<div class="kpis"><div class="kpi"><span class="cap">Latest balance</span><div class="v">${money(dpts[dpts.length-1])}</div></div>${dpts.length>1?`<div class="kpi"><span class="cap">Paid down this year</span><div class="v ${dpts[0]-dpts[dpts.length-1]>=0?"pos":"neg"}">${money(dpts[0]-dpts[dpts.length-1])}</div></div>`:""}</div>`

  // fitness by month

  const fmins = fit.map(l => l.reduce((a,e)=>a+num(e.mins),0));
  const fsess = fit.map(l => l.length), fmi = fit.map(l => l.reduce((a,e)=>a+num(e.dist),0));
  const yrMin = fmins.reduce((a,b)=>a+b,0), yrMi = fmi.reduce((a,b)=>a+b,0), yrS = fsess.reduce((a,b)=>a+b,0);
  const fitBody = yrS ? `<div class="kpis"><div class="kpi"><span class="cap">Sessions in ${y}</span><div class="v">${yrS}</div></div><div class="kpi"><span class="cap">Hours</span><div class="v">${(yrMin/60).toFixed(1)}</div></div><div class="kpi"><span class="cap">Miles</span><div class="v">${yrMi.toFixed(0)}</div></div></div>`
    + columns(fmins, MON3.map(x=>x[0]), {cur:isThisYear?td.getMonth():null, label:"Workout minutes by month", fmt:v=>v>=1000?(v/60).toFixed(0)+"h":Math.round(v), tip:(i,v)=>`${MONTHS[i]}: ${Math.round(v)} min · ${fsess[i]} sessions · ${fmi[i].toFixed(1)} mi`})
    : dempty(`No workouts logged in ${y} yet.`, "fitness", "Log a workout");

  // workout mix this month
  const mixLog = fit[m], mix = {};
  mixLog.forEach(e => { const t = e.type||"Other"; mix[t] = (mix[t]||0) + (num(e.mins)||0); });
  const mixItems = Object.entries(mix).sort((a,b)=>b[1]-a[1]);
  const mixBody = mixItems.length ? hbars(mixItems.map(([t,v]) => ({label:t, value:v, text:`${Math.round(v)} min`, tip:`${t}: ${Math.round(v)} minutes in ${MONTHS[m]}`})))
    : `<div class="dempty">No workouts in ${MONTHS[m]} yet.</div>`;

  // notes
  const notes = [...store.entries()].filter(([k,v]) => k[0]==="n" && v && (v.date||"").slice(0,4)===String(y));
  const nByType = Object.keys(NOTE_TYPES).map(t => ({t, c:notes.filter(([,v])=>v.type===t).length}));

    : dempty(`No work notes in ${y} yet.`, "notes", "Start one");

  const gOk = gOn() && G.state==="ok", nowMin = nowT.getHours()*60 + nowT.getMinutes();
  const upItems = [
    ...(gOk ? upEv.map(e => ({t: e.allDay ? -1 : e.start.getTime(), h: evChip(e, true)})) : []),
    ...blocksOf(ymd(td)).filter(b => b.s + b.dur > nowMin).map(b => ({t: new Date(td.getFullYear(), td.getMonth(), td.getDate(), 0, b.s).getTime(), h: blkSm(b, true)})),
    ...blocksOf(ymd(tom)).map(b => ({t: new Date(tom.getFullYear(), tom.getMonth(), tom.getDate(), 0, b.s).getTime(), h: blkSm({...b, note: b.note ? "Tomorrow · " + b.note : "Tomorrow"}, true)})),
  ].sort((a,b) => a.t - b.t).slice(0,7);

    ${actsToday.length ? `<ul class="acts">${actsToday.map(a => { const m0 = mem.find(x => x.id===a.who); return `<li>${m0?`<span class="whochip" style="--c:${tc(m0.c)}">${esc(m0.name||"Someone")}</span>`:`<span class="whochip" style="--c:var(--t3)">Everyone</span>`}<span>${esc(a.t)}</span></li>`; }).join("")}</ul>` : `<p class="muted" style="margin:0;font-size:13.5px">No family activities today.</p>`}`
    : dempty("Plan the family's week, meals and groceries in one place.", "family", "Open Family");

  const who = (name.match(/^(.+?)['\u2019]s\b/) || [])[1] || "";
  return head(`${hello}${who && !/^my$/i.test(who) ? ", "+esc(who.trim()) : ""}`, `${DOWL[dowIdx(td)]}, ${MONTHS[td.getMonth()]} ${td.getDate()}, ${td.getFullYear()}${isThisYear?"":` · showing ${y}`}`) +
  `<div class="dash">
    ${card("s4","Up next",8,["day","Open day"],nextBody)}
    ${card("s4","Today",4,["day","Plan today"],todayBody)}
    ${card("s4","Year progress",1,["year","Year view"],yearBody)}
    ${card("s6","Family",2,["family","Family"],famBody)}

    ${card("s6","Goals",5,["goals","All goals"],goalsBody)}
    ${card("s6",`Habits · ${MONTHS[m]}`,5,["goals","Tracker"],habBody)}

        <button class="btn" type="submit" style="align-self:flex-start">Add</button>

  }

function firstEmpty(arr, min){ for(let i=0;i<Math.max(min, arr.length);i++){ if(!arr[i] || !arr[i].t || !String(arr[i].t).trim()) return i; } return Math.max(min, arr.length); }
function addTodos(k, lines, min){ const doc = clone(get(k)); doc.todo = doc.todo || []; lines.forEach(t => { const i = firstEmpty(doc.todo, min); doc.todo[i] = {t}; }); put(k, doc); }
function quickAdd(text){
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean); if(!lines.length) return false;
  const td = todayDate();
  if(S.qTarget==="today"){ addTodos("d"+ymd(td), lines, 10); toast(lines.length>1 ? `Added ${lines.length} to-dos for today` : "Added to today's to-dos"); }
  else if(S.qTarget==="tomorrow"){ addTodos("d"+ymd(addDays(td,1)), lines, 10); toast("Added to tomorrow's to-dos"); }
  else if(S.qTarget==="week"){ addTodos("fw"+ymd(weekStart(td)), lines, 8); toast("Added to this week's to-dos"); }
  else if(S.qTarget==="grocery"){ const doc = clone(get("groc")); doc.items = (doc.items||[]).filter(i => i && i.t); lines.forEach(t => doc.items.push({t})); put("groc", doc); toast(lines.length>1 ? `Added ${lines.length} grocery items` : "Added to the grocery list"); }
  else { const k = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); put(k, {type:"dump", title:lines[0].slice(0,80), date:ymd(td), body:text, updated:Date.now()}); toast("Saved as a brain dump note"); }
  return true;
}
function shiftBy(n){
  const y = Y(), m = M(), d = S.day.getDate();
  if(S.view==="day") S.day = addDays(S.day, n);
  else if(S.view==="week" || S.view==="family") S.day = addDays(S.day, 7*n);
  else { let tm = m+n, ty = y + Math.floor(tm/12); tm = ((tm%12)+12)%12; S.day = new Date(ty, tm, Math.min(d, dim(ty,tm))); }
  render();
}

function vYear(){
  const y = Y(), k = "y"+y, td = todayDate(), hol = holidays(y);
  const minis = MONTHS.map((name,m) => {
    const first = new Date(y,m,1), off = dowIdx(first), n = dim(y,m);
    let cells = DOW.map(d=>`<span class="dw">${d[0]}</span>`).join("") + "<span></span>".repeat(off);
    for(let d=1; d<=n; d++){
      const dt = new Date(y,m,d), key = ymd(dt), h = hol[`${pad(m+1)}-${pad(d)}`];
      const cls = [isWE(dt)?"we":"", h?"hol":"", (nonEmpty(store.get("d"+key)) || evOn(key).length)?"has":"", sameDay(dt,td)?"today":""].join(" ");
      cells += `<button class="${cls}" data-go="day" data-date="${key}" aria-label="${name} ${d}${h?", "+esc(h):""}"${h?` title="${esc(h)}"`:""}>${d}</button>`;
    }
    return `<div class="mini" style="--c:${tc(MONTH_COLORS[m])}"><h3><button data-go="month" data-date="${ymd(first)}">${name}</button></h3><div class="mg">${cells}</div></div>`;
  }).join("");
  const tops = [0,1,2,3,4].map(i => `<div class="row"><span class="lbl" style="margin:0;width:16px">${i+1}</span>${I(k,`top.${i}`,{ph:i===0?"The one that matters most":"",label:`Year goal ${i+1}`})}</div>`).join("");
  return head(`${y} at a glance`, `${yearLen(y)} days · tap a date to open its page, or a month name for the month`) +
  `<div class="two"><div class="months">${minis}</div>
   <div class="panel">
     <div class="word"><p class="lbl">Word of the year</p>${I(k,"word",{ph:"Steady",label:"Word of the year"})}</div>

     <div><p class="lbl">Vision</p>${T(k,"vision",{rows:6,ph:"By December I want…",label:"Vision for the year"})}</div>

}

function vMonth(){

  let cells = `<div class="cell blank"></div>`.repeat(off);

    cells += `<div class="cell${sameDay(dt,td)?" today":""}"><div class="dn"><button data-go="day" data-date="${key}" data-dw="${DOW[dowIdx(dt)]}" aria-label="Open ${MONTHS[m]} ${d}">${d}</button>${h?`<span class="hn" title="${esc(h)}">${esc(h)}</span>`:""}</div>${st.length?`<div class="stks">${st.slice(0,3).map(stickerHtml).join("")}</div>`:""}${(() => { const ev = evOn(key); return ev.length ? `<div class="evs">${ev.slice(0,3).map(e => evChip(e)).join("")}${ev.length>3?`<span class="more">+${ev.length-3} more</span>`:""}</div>` : ""; })()}${T(k,`cells.${d}`,{cls:"",rows:2,label:`${MONTHS[m]} ${d}`})}</div>`;
  }
  cells += `<div class="cell blank"></div>`.repeat((7 - (off+n)%7) % 7);

  return `<div style="--sec:${tc(MONTH_COLORS[m])}">` + head(`${MONTHS[m]} ${y}`, `${n} days · tap a date number to open that day`, shiftNav("month")) +
  `<div class="mgrid"><div><div class="dowh">${DOW.map(d=>`<span>${d}</span>`).join("")}</div><div class="cal">${cells}</div></div>

function vWeek(){
  const mon = weekStart(S.day), k = "w"+ymd(mon), sun = addDays(mon,6), td = todayDate();
  const range = mon.getMonth()===sun.getMonth() ? `${MONTHS[mon.getMonth()]} ${mon.getDate()}–${sun.getDate()}, ${sun.getFullYear()}` : `${MON3[mon.getMonth()]} ${mon.getDate()} – ${MON3[sun.getMonth()]} ${sun.getDate()}, ${sun.getFullYear()}`;
  const boxes = DOWL.map((name,i) => {
    const dt = addDays(mon,i), key = ymd(dt), dd = store.get("d"+key) || {}, h = holOf(dt), st = dayStickers(key);
    const pris = (dd.pri||[]).filter(x => x && x.t && x.t.trim());
    return `<section class="dbox${sameDay(dt,td)?" today":""}"><header><button data-go="day" data-date="${key}">${name}</button><span>${MON3[dt.getMonth()]} ${dt.getDate()}</span></header>
      ${h||st.length?`<div class="stks">${h?`<span class="stk" style="--c:var(--sec)">${esc(h)}</span>`:""}${st.map(stickerHtml).join("")}</div>`:""}
      ${pris.length?`<ul>${pris.map(p=>`<li>${p.done?"<s>":""}${esc(p.t)}${p.done?"</s>":""}</li>`).join("")}</ul>`:""}
      ${blocksOf(key).length ? `<div class="evs">${blocksOf(key).map(b => blkSm(b)).join("")}</div>` : ""}

}

function vDay(){
  const d = S.day, key = ymd(d), k = "d"+key, h = holOf(d), now = new Date(), st = (get(k).stk)||{};
  const evs = evOn(key), allDay = evs.filter(e => e.allDay), timed = evs.filter(e => !e.allDay);
  const slotOf = e => sameDay(e.start, d) ? Math.min(21, Math.max(6, e.start.getHours())) : 6;
  const blocks = blocksOf(key), G0 = 360, G1 = 1320;
  const items = [
    ...timed.map(e => { const a = sameDay(e.start, d) ? e.start.getHours()*60 + e.start.getMinutes() : 0; const z = sameDay(e.end, d) ? e.end.getHours()*60 + e.end.getMinutes() : 1440; return {kind:"e", e, s:a, end:Math.max(a+15, z)}; }),
    ...blocks.map(b => ({kind:"b", b, s:b.s, end:b.s + b.dur})),
  ].sort((x,y) => x.s - y.s || y.end - x.end);
  /* side-by-side columns for overlapping items */
  let cluster = [], cEnd = -1;
  const flush = () => { const cols = []; cluster.forEach(it => { let c = cols.findIndex(endAt => endAt <= it.s); if(c<0){ c = cols.length; cols.push(0); } cols[c] = it.end; it.col = c; }); cluster.forEach(it => it.ncol = cols.length); cluster = []; };
  items.forEach(it => { if(it.s >= cEnd && cluster.length) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.end); });
  if(cluster.length) flush();
  const pos = it => `top:calc(var(--hh) * ${((it.s - G0)/60).toFixed(4)});height:calc(var(--hh) * ${((it.end - it.s)/60).toFixed(4)});left:calc(${(100/it.ncol*it.col).toFixed(3)}% + 1px);width:calc(${(100/it.ncol).toFixed(3)}% - 3px)`;
  const tiHtml = it => {
    const short = (it.end - it.s) < 45;
    if(it.kind==="e"){ const e = it.e, inner = `<div class="tl"><span>${esc(e.title)}</span></div>${short?"":`<b>${fmtMin(it.s)}–${fmtMin(it.end)}</b>`}`;
      return e.link ? `<a class="ti te${short?" short":""}" href="${esc(e.link)}" target="_blank" rel="noopener" style="${pos(it)}${e.color?`;--ec:${e.color}`:""}" title="${esc(e.title)} · ${fmtMin(it.s)}–${fmtMin(it.end)}">${inner}</a>` : `<div class="ti te${short?" short":""}" style="${pos(it)}${e.color?`;--ec:${e.color}`:""}">${inner}</div>`; }
    const b = it.b, L = BT[b.t].l;
    return `<div class="ti tb${short?" short":""}" tabindex="0" role="button" data-blk="${b.id}" style="${pos(it)};--c:${tc(BT[b.t].c)}" aria-label="${L}, ${fmtMin(b.s)} to ${fmtMin(b.s+b.dur)}. Drag to move, drag the top or bottom edge to change the time, or tap to edit.">
      <span class="rh top" data-edge="top" aria-hidden="true"></span>
      <div class="tl">${bIcon(b.t)}<span>${L}</span>${b.rec ? `<i class="rp" title="Repeats ${esc(repeatLabel(b.days).toLowerCase())}" aria-label="repeats">↻</i>` : ""}${short?`<b class="tr">${fmtMin(b.s)}–${fmtMin(b.s+b.dur)}</b>`:""}</div>${short?"":`<b class="tr">${fmtMin(b.s)}–${fmtMin(b.s+b.dur)}</b>${b.note?`<em>${esc(b.note)}</em>`:""}`}
      <span class="rh bot" data-edge="bot" aria-hidden="true"></span></div>`;
  };
  let rows = "";
  for(let hr=6; hr<=21; hr++){
    const isNow = sameDay(d, now) && now.getHours()===hr;
    rows += `<div class="trow" data-hr="${hr}"><span class="t${isNow?" now":""}">${fmtHour(hr)}</span><div class="tnote">${I(k,`sched.${hr}`,{label:`${fmtHour(hr)} note`, ph: hr===6 && !blocks.length ? "Notes" : ""})}</div></div>`;
  }
  const nowMin = now.getHours()*60 + now.getMinutes();
  const nowLine = sameDay(d, now) && nowMin >= G0 && nowMin <= G1 ? `<div class="nowline" style="top:calc(var(--hh) * ${((nowMin-G0)/60).toFixed(4)})"></div>` : "";
  const sched = `${rows}<div class="lane-guide"></div><div class="lane" id="lane">${items.map(tiHtml).join("")}</div>${nowLine}`;
  const btray = `<div class="btray-wrap"><p class="cap" style="margin:0 0 7px">Drag onto your schedule, or tap one and then tap a time</p><div class="btray">${BLOCKS.map(([id,l,c]) => `<button class="blk-src" data-bt="${id}" style="--c:${tc(c)}" aria-pressed="${S.pickBlock===id}" aria-label="${l}. Drag onto an hour, or tap and then tap an hour.">${bIcon(id)}${l}</button>`).join("")}</div>${S.pickBlock?`<p class="pickhint" role="status">Tap a time on the schedule to add ${BT[S.pickBlock].l}. <button class="linkb" data-act="pickcancel">Cancel</button></p>`:""}</div>`;
  const pri = [0,1,2].map(i => `<div class="row pri${val(k,`pri.${i}.done`)?" done":""}"><span class="n">${i+1}</span>${C(k,`pri.${i}.done`)}${I(k,`pri.${i}.t`,{label:`Priority ${i+1}`})}</div>`).join("");
  const nTodo = Math.max(10, (get(k).todo||[]).length);
  const todo = Array.from({length:nTodo},(_,i) => { const t = val(k,`todo.${i}.t`); return `<div class="row${val(k,`todo.${i}.done`)?" done":""}">${C(k,`todo.${i}.done`)}${I(k,`todo.${i}.t`,{label:`To-do ${i+1}`})}${t && String(t).trim() && !val(k,`todo.${i}.done`) ? `<button class="xb mv" data-act="mvtodo" data-i="${i}" aria-label="Move to tomorrow" title="Move to tomorrow">↷</button>` : ""}</div>`; }).join("");
  const tray = STICKERS.map(([id,l,c]) => `<button data-act="stk" data-id="${id}" aria-pressed="${!!st[id]}" aria-label="${l} sticker"><span class="stk" style="--c:${tc(c)}">${l}</span></button>`).join("");
  return head(`${DOWL[dowIdx(d)]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`,
    `Day ${dayOfYear(d)} of ${yearLen(d.getFullYear())} · Week ${weekNo(d)}${h?` · <b style="color:var(--accent)">${esc(h)}</b>`:""}`, shiftNav("day")) +
  `<div class="dayg">
    <div class="sec"><div><p class="lbl">Schedule</p>${gBar(true)}${allDay.length?`<div class="evs" style="margin:${gBar(true)?"10px":"0"} 0 10px">${allDay.map(e => evChip(e, true)).join("")}</div>`:""}${btray}<div class="tgrid${S.pickBlock?" picking":""}" id="tgrid">${sched}</div>${(() => { const early = blocks.filter(b => b.s < 360 || b.s + b.dur > 1320); return early.length ? `<div class="evs" style="margin-top:8px"><span class="cap">Outside 6a–10p</span>${early.map(b => blkSm(b, true)).join("")}</div>` : ""; })()}</div>
      <div><p class="lbl">Stickers</p><div class="stray">${tray}</div><p class="muted" style="font-size:13px;margin:8px 0 0">Tap to stick one on this day. They show up on the week and month pages too.</p></div></div>
    <div class="sec">
      <div class="panel" style="gap:6px"><p class="lbl">Top 3</p><div class="stack">${pri}</div></div>
      <div><p class="lbl">To do</p><div class="stack">${todo}</div></div>
      <div><p class="lbl">Notes</p>${T(k,"notes",{rows:5,label:"Day notes"})}</div>
      <div><p class="lbl">Today's win</p>${I(k,"win",{ph:"One thing that went right",label:"Today's win"})}</div>
    </div></div>`;
}

    for(let d=1; d<=n; d++){ const we = isWE(new Date(y,m,d)); tds += `<td class="${we?"we":""}">${C(hk,`habits.${i}.days.${d}`,`Habit ${i+1}, day ${d}`)}</td>`; }

function logoError(t){ const el = document.getElementById("logo-err"); if(el){ el.textContent = t; el.hidden = !t; } }
function handleLogo(file){
  logoError("");
  if(!file) return;
  if(!/^image\//.test(file.type || "")) return logoError("That file isn't an image. Choose a PNG, JPG, SVG or WebP.");
  if(file.size > 20*1024*1024) return logoError("That image is over 20 MB. Choose a smaller one.");
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const max = 192, nw = img.naturalWidth || max, nh = img.naturalHeight || max, r = Math.min(1, max / Math.max(nw, nh));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(nw*r)); c.height = Math.max(1, Math.round(nh*r));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let data = ""; try { data = c.toDataURL("image/webp", 0.9); } catch(e) {}
    if(!data.startsWith("data:image/webp")) data = c.toDataURL("image/png");
    edit("settings", "logo", data); applyBrand(); renderMenu(); if(S.view==="cover") render(); toast("Logo updated");
  };
  img.onerror = () => { URL.revokeObjectURL(url); logoError("That image couldn't be opened. Try a PNG or JPG."); };
  img.src = url;
}
function applySettings(){

  [...app.classList].forEach(c => { if((c.startsWith("theme-") || c.startsWith("dark-")) && c!==want) app.classList.remove(c); });
  app.classList.add(want);
  document.body.style.background = getComputedStyle(app).getPropertyValue("--desk").trim();
}

/* ---------- block lookup and updates (one-off or repeating) ---------- */
function findBlock(id){ return blocksOf(ymd(S.day)).find(b => b.id===id); }
function editRec(fn){ const doc = clone(get("rec")); doc.series = (doc.series||[]).filter(Boolean); fn(doc); put("rec", doc); }
function updateBlock(b, ch, scope){
  if(!b.rec){
    const k = "d"+ymd(S.day), doc = clone(get(k)), x = (doc.blocks||[]).find(y => y && y.id===b.id); if(!x) return;
    Object.assign(x, ch); if(!x.note) delete x.note; put(k, doc); return;
  }
  editRec(doc => {
    const x = doc.series.find(y => y.id===b.rec); if(!x) return;
    if(scope==="all"){ Object.assign(x, ch); if(!x.note) delete x.note; if(ch.s!=null || ch.dur!=null || ch.t || "note" in ch) x.ov = {}; }
    else { x.ov = x.ov || {}; x.ov[b.date] = {...(x.ov[b.date]||{}), ...ch}; }
  });
}
function removeBlock(b, scope){
  if(!b.rec){ const k = "d"+ymd(S.day), doc = clone(get(k)); doc.blocks = (doc.blocks||[]).filter(y => y && y.id!==b.id); put(k, doc); return; }
  editRec(doc => {
    const i = doc.series.findIndex(y => y.id===b.rec); if(i<0) return; const x = doc.series[i];
    if(scope==="one"){ x.skip = [...new Set([...(x.skip||[]), b.date])]; }
    else { const prev = ymd(addDays(parseYmd(b.date), -1)); if(prev < x.start) doc.series.splice(i,1); else x.until = prev; }
  });
}
function setRepeat(b, days, until){
  const date = ymd(S.day), vals = { t: b.t, s: b.s, dur: b.dur, note: b.note };
  if(!b.rec){
    if(!days.length) return;
    removeBlock(b);
    editRec(doc => doc.series.push({ id: newId(), ...vals, days, start: date, until: until || "" }));
    return;
  }
  if(!days.length){
    removeBlock(b, "future");
    const k = "d"+date, doc = clone(get(k)); doc.blocks = (doc.blocks||[]).filter(Boolean); doc.blocks.push({ id: newId(), ...vals }); if(!vals.note) delete doc.blocks[doc.blocks.length-1].note; put(k, doc);
    return;

}

/* ---------- activity blocks: drag to add, move and resize ---------- */
const DR = { src:null, on:false };
const SNAP = 15, G_START = 360;
const snap = m => Math.round(m / SNAP) * SNAP;
function blockKey(){ return "d" + ymd(S.day); }
function newId(){ return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function addBlock(type, startMin){
  const k = blockKey(), doc = clone(get(k)), dur = BT[type].dur;
  const s0 = Math.max(0, Math.min(1440 - dur, startMin));
  doc.blocks = (doc.blocks||[]).filter(Boolean);
  doc.blocks.push({ id: newId(), t: type, s: s0, dur });
  put(k, doc); toast(`Added ${BT[type].l}, ${fmtMin(s0)}–${fmtMin(s0+dur)}`);
}
function gridInfo(){ const g = document.getElementById("tgrid"); if(!g) return null; const r = g.getBoundingClientRect(); return { g, r, hh: parseFloat(getComputedStyle(g).getPropertyValue("--hh")) || 56 }; }
const minAtY = (gi, y) => G_START + (y - gi.r.top) / gi.hh * 60;
function overGrid(gi, x, y){ return gi && x >= gi.r.left && x <= gi.r.right && y >= gi.r.top && y <= gi.r.bottom; }
function placeEl(el, s0, dur){
  el.style.top = `calc(var(--hh) * ${((s0 - G_START)/60).toFixed(4)})`;
  el.style.height = `calc(var(--hh) * ${(dur/60).toFixed(4)})`;
  el.querySelectorAll(".tr").forEach(t => t.textContent = `${fmtMin(s0)}–${fmtMin(s0+dur)}`);
}
function applyDrag(){
  const gi = gridInfo(); if(!gi) return;
  if(DR.kind === "new"){
    if(DR.ghost){ DR.ghost.style.left = DR.cx + "px"; DR.ghost.style.top = DR.cy + "px"; }
    const lane = document.getElementById("lane");
    if(overGrid(gi, DR.cx, DR.cy)){
      const dur = BT[DR.type].dur, s0 = Math.max(0, Math.min(1440 - dur, snap(minAtY(gi, DR.cy) - 15)));
      if(!DR.prev){ DR.prev = document.createElement("div"); DR.prev.className = "tprev"; DR.prev.style.left = "0"; DR.prev.style.right = "0"; lane.appendChild(DR.prev); }
      DR.prev.style.top = `calc(var(--hh) * ${((s0 - G_START)/60).toFixed(4)})`; DR.prev.style.height = `calc(var(--hh) * ${(dur/60).toFixed(4)})`;
      DR.prev.textContent = `${BT[DR.type].l} ${fmtMin(s0)}–${fmtMin(s0+dur)}`; DR.ns = s0;
    } else { if(DR.prev){ DR.prev.remove(); DR.prev = null; } DR.ns = null; }
    return;
  }
  const m = minAtY(gi, DR.cy), end0 = DR.s0 + DR.d0;
  let ns = DR.s0, nd = DR.d0;
  if(DR.kind === "move"){ ns = Math.max(0, Math.min(1440 - DR.d0, snap(m - DR.grab))); }
  else if(DR.kind === "top"){ ns = Math.max(0, Math.min(end0 - SNAP, snap(m - DR.grab))); nd = end0 - ns; }
  else if(DR.kind === "bot"){ const ne = Math.min(1440, Math.max(DR.s0 + SNAP, snap(m - DR.grab))); nd = ne - DR.s0; }
  DR.ns = ns; DR.nd = nd; placeEl(DR.src, ns, nd);
}
function dragLoop(){
  if(!DR.on) return;
  const vh = window.innerHeight, bn = document.getElementById("bnav"), bottomPad = bn && getComputedStyle(bn).display!=="none" ? bn.offsetHeight + 16 : 24;
  let v = 0;
  if(DR.cy < 100) v = -Math.ceil((100 - DR.cy) / 5);
  else if(DR.cy > vh - bottomPad - 70) v = Math.ceil((DR.cy - (vh - bottomPad - 70)) / 5);
  if(v){ window.scrollBy(0, Math.max(-24, Math.min(24, v))); applyDrag(); }
  DR.raf = requestAnimationFrame(dragLoop);
}
function startDrag(){
  DR.on = true; tip.hidden = true;
  document.body.classList.add("dragging");
  if(DR.kind === "new"){ const g = DR.src.cloneNode(true); g.classList.add("dragghost"); g.removeAttribute("aria-pressed"); app.appendChild(g); DR.ghost = g; }
  else DR.src.classList.add("live");
  DR.raf = requestAnimationFrame(dragLoop);
}
function endDrag(commit){
  cancelAnimationFrame(DR.raf);
  const { kind, type, blk, ns, nd } = DR;
  if(DR.ghost) DR.ghost.remove(); if(DR.prev) DR.prev.remove();
  document.body.classList.remove("dragging");
  Object.assign(DR, { src:null, on:false, ghost:null, prev:null });
  if(commit){
    if(kind === "new" && ns != null){ S.pickBlock = null; addBlock(type, ns); }
    else if(kind !== "new" && ns != null){
      const b = findBlock(blk);
      if(b && (b.s !== ns || b.dur !== nd)){ updateBlock(b, { s: ns, dur: nd }, "one"); toast(b.rec ? `${BT[b.t].l} ${fmtMin(ns)}–${fmtMin(ns+nd)} on this day only. Tap it to change every repeat.` : `${BT[b.t].l} ${fmtMin(ns)}–${fmtMin(ns+nd)}`); }
    }
  }

}

  else if(a==="gconnect"){ gConnect(); }
  else if(a==="grefresh"){ gRefresh(); }
  else if(a==="gdisc"){ gDisconnect(); }
  else if(a==="gcaltog"){
    const doc = clone(get("settings")), hid = new Set(doc.gcalHidden || []);
    if(b.checked) hid.delete(b.dataset.id); else hid.add(b.dataset.id);
    doc.gcalHidden = [...hid]; put("settings", doc); gRebuild(); render(); paintG();
  }
  else if(a==="mvtodo"){
    const k = "d"+ymd(S.day), doc = clone(get(k)), i = +b.dataset.i, item = (doc.todo||[])[i];
    if(!item || !item.t) return;
    const tk = "d"+ymd(addDays(S.day,1)); addTodos(tk, [item.t], 10);
    doc.todo[i] = {}; put(k, doc); render(); toast("Moved to tomorrow");
  }
  else if(a==="famwho"){ S.famWho = b.dataset.id; render(); }
  else if(a==="famadd"){ const doc = clone(get("family")); doc.members = doc.members || []; const used = doc.members.map(x => x.c); const c = [4,5,6,7,8,1,2,3].find(x => !used.includes(x)) || 1; doc.members.push({id:"p"+Date.now().toString(36), name:"", c}); put("family", doc); render(); const ins = main.querySelectorAll('[data-k="family"][data-p$=".name"]'); if(ins.length) ins[ins.length-1].focus(); }
  else if(a==="famrm"){ const doc = clone(get("family")); const rm = (doc.members||[]).splice(+b.dataset.i,1)[0]; if(rm && S.famWho===rm.id) S.famWho = "all"; put("family", doc); render(); }
  else if(a==="famcolor"){ const doc = clone(get("family")), mm = doc.members[+b.dataset.i]; mm.c = (mm.c % 8) + 1; put("family", doc); render(); }
  else if(a==="famdel"){ const k = "fw"+ymd(weekStart(S.day)), doc = clone(get(k)); ((doc.acts||{})[b.dataset.d]||[]).splice(+b.dataset.j,1); put(k, doc); render(); }
  else if(a==="grocdel"){ const doc = clone(get("groc")); (doc.items||[]).splice(+b.dataset.i,1); put("groc", doc); render(); }
  else if(a==="grocclear"){ const doc = clone(get("groc")); doc.items = (doc.items||[]).filter(x => x && x.t && !x.done); put("groc", doc); render(); toast("Cleared checked items"); }
  else if(a==="light" || a==="dark" || a==="mode"){
    const p = prefs(); const doc = clone(get("settings"));
    doc.light = p.light; doc.dark = p.dark; doc.mode = p.mode; delete doc.theme;
    doc[a] = b.dataset.t;
    if(a==="light" && p.mode!=="light" && isDark(p.mode)) doc.mode = "light";
    if(a==="dark" && !isDark(p.mode)) doc.mode = "dark";
    put("settings", doc); render(); renderMenu();
    const nb = document.querySelector(`#drawer [data-act="${a}"][data-t="${b.dataset.t}"]`); if(nb) nb.focus();
  }
  else if(a==="cover"){ edit("settings","cover",b.dataset.c); render(); if(S.menu) renderMenu(); }
  else if(a==="stk"){ const k = "d"+ymd(S.day); edit(k, `stk.${b.dataset.id}`, !val(k,`stk.${b.dataset.id}`)); b.setAttribute("aria-pressed", String(!!val(k,`stk.${b.dataset.id}`))); }
  else if(a==="add"){ const doc = clone(get(b.dataset.k)); const arr = getPath(doc,b.dataset.p) || []; arr.push({}); setPath(doc,b.dataset.p,arr); put(b.dataset.k, doc); render();
    const inp = main.querySelector(`[data-p^="${b.dataset.p}.${arr.length-1}."]`); if(inp) inp.focus(); }
  else if(a==="del"){ const doc = clone(get(b.dataset.k)); const arr = getPath(doc,b.dataset.p) || []; arr.splice(+b.dataset.i,1); setPath(doc,b.dataset.p,arr); put(b.dataset.k, doc); render(); }
  else if(a==="copyprev"){
    const k = "b"+mk(y,m), pk = prevMonthKey("b",y,m);
    if(!store.has(pk)){ setStatus(`${MONTHS[(m+11)%12]} has no budget to copy yet.`, "err"); return; }
    const p = store.get(pk), doc = clone(get(k));
    doc.expenses = (p.expenses||[]).map(r => ({cat:(r&&r.cat)||"", plan:(r&&r.plan)||""}));
    doc.income = (p.income||[]).map(r => ({src:(r&&r.src)||"", amt:(r&&r.amt)||""}));
    doc.debts = (p.debts||[]).filter(r=>r&&r.name).map(r => ({name:r.name, bal:Math.max(0, num(r.bal)-num(r.paid)).toFixed(2)}));
    put(k, doc); render();
  }
  else if(a==="fitdel"){ const k = "f"+mk(y,m), doc = clone(get(k)); (doc.log||[]).splice(+b.dataset.i,1); put(k, doc); render(); }
  else if(a==="ntype"){ S.noteType = b.dataset.t; render(); }
  else if(a==="nopen"){ S.noteId = b.dataset.id; render(); }
  else if(a==="nnew"){
    const t = b.dataset.t, k = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const td = todayDate(), date = td.getFullYear()===y ? ymd(td) : ymd(S.day);
    put(k, {type:t, title:"", date, body:NOTE_TPL[t], updated:Date.now()});
    S.noteId = k; if(S.noteType!=="all" && S.noteType!==t) S.noteType = "all"; render();
    const ti = document.getElementById(fid(k,"title")); if(ti) ti.focus();
  }
  else if(a==="ndel"){
    if(S.delArm === S.noteId){ remove(S.noteId); S.noteId = null; S.delArm = null; render(); }
    else { S.delArm = S.noteId; render(); setTimeout(() => { if(S.delArm){ S.delArm = null; if(!editing()) render(); } }, 4000); }
  }
});

/* read-only hook used by automated tests */
try { Object.defineProperty(window, "__daybook", { value: Object.freeze({ blocksOn: k => blocksOf(k).map(b => ({ t: b.t, s: b.s, dur: b.dur, rec: !!b.rec })), goDay: d => { S.day = parseYmd(d); go("day"); } }) }); } catch(e) {}
render();
setStatus("Saved on this device");

/* ---------- Google Calendar start-up ---------- */
(async () => {
  try {
    if(!window.claude || !window.claude.use){ startDirect(); return; }
    const mcp = await window.claude.use("mcp");
    if(!mcp){ G.state = "unavailable"; paintG(); softRender(); return; }
    G.mcp = mcp; await gStart();
  } catch(e){ G.state = "unavailable"; paintG(); softRender(); }
})();

/* ---------- account sync ---------- */
(async () => {
  try {
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setStatus("Saved on this device only (sign in to sync)"); return; }
    DB = db.collection("data/users/" + uid);
    let first = true;
    DB.onSnapshot(snap => {
      let changed = false;
      if(first){
        const ids = new Set(snap.docs.map(d => d.id));
        [...store.keys()].forEach(k => { if(!ids.has(k) && !pending.has(k)){ store.delete(k); changed = true; } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if(ch.doc.metadata.hasPendingWrites || pending.has(id)) return;
        if(ch.type==="removed") store.delete(id); else store.set(id, clone(ch.doc.data()));
        changed = true;
      });
      if(first){ first = false; [...pending].forEach(flush); if(!pending.size) setStatus("Synced", "ok"); }
      if(changed){ migrateWeeks(); cacheLocal(); if(editing()) dirty = true; else render(); }
    }, () => setStatus("Sync stopped. Reload the page to reconnect.", "err"));
  } catch(e) { setStatus("Saved on this device only"); }
})();
})();
</script>
