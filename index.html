  lines.forEach(l => { const r = qParse(l, td);
    if(r.kind === "block"){ addBlock(r.type, r.start, { key: "d" + ymd(r.date), dur: r.dur, title: r.title, quiet: true }); n.block++; firstDay = firstDay || r.date; }
    else if(r.kind === "appt"){ const doc = clone(get("health")); doc.appts = (doc.appts || []).filter(a => a && (a.what || a.who)); const dr = r.title.match(/\b(dr\.?\s+[a-z][\w'-]*)/i);
      doc.appts.push({ date: ymd(r.date), time: r.start != null ? pad(Math.floor(r.start/60)) + ":" + pad(r.start%60) : "", who: dr ? dr[1].replace(/^dr\.?/i, "Dr.") : "", what: cap1(dr ? r.title.replace(dr[1], "").replace(/\s{2,}/g, " ").trim() || "Appointment" : r.title) }); put("health", doc); n.appt++; }

    else { addTodos("d" + ymd(r.date), [r.title], 10); n.todo++; }

  toast("Added " + parts.join(", "));

function firstEmpty(arr, min){ for(let i=0;i<Math.max(min, arr.length);i++){ if(!arr[i] || !arr[i].t || !String(arr[i].t).trim()) return i; } return Math.max(min, arr.length); }
function addTodos(k, lines, min){ const doc = clone(get(k)); doc.todo = doc.todo || []; lines.forEach(t => { const i = firstEmpty(doc.todo, min); doc.todo[i] = {t}; }); put(k, doc); }
function quickAdd(text){
  const lines = text.split("\n").map(s => s.trim()).filter(Boolean); if(!lines.length) return false;

  if(S.qTarget==="auto"){ quickAuto(lines); }
  else if(S.qTarget==="today"){ addTodos("d"+ymd(td), lines, 10); toast(lines.length>1 ? `Added ${lines.length} to-dos for today` : "Added to today's to-dos"); }
  else if(S.qTarget==="tomorrow"){ addTodos("d"+ymd(addDays(td,1)), lines, 10); toast("Added to tomorrow's to-dos"); }
  else if(S.qTarget==="week"){ addTodos("fw"+ymd(weekStart(td)), lines, 8); toast("Added to this week's to-dos"); }

function shiftBy(n){

let lastLay = null;

function vDay(){
  const d = S.day, key = ymd(d), k = "d"+key, h = holOf(d), now = new Date(), st = (get(k).stk)||{};
  const evs = evOn(key), allDay = evs.filter(e => e.allDay), timed = evs.filter(e => !e.allDay);

      return e.link ? `<a class="ti te${short?" short":""}" href="${esc(e.link)}" target="_blank" rel="noopener" style="${pos(it)}${e.color?`;--ec:${e.color}`:""}" title="${esc(e.title)} · ${fmtMin(it.s)}–${fmtMin(it.end)}">${inner}</a>` : `<div class="ti te${short?" short":""}" style="${pos(it)}${e.color?`;--ec:${e.color}`:""}">${inner}</div>`; }
    const b = it.b, L = esc(blkName(b));

      <div class="tl">${bIcon(b.t)}<span>${L}</span>${b.rec ? `<i class="rp" title="Repeats ${esc(repeatLabel(b.days).toLowerCase())}" aria-label="repeats">↻</i>` : ""}${short?`<b class="tr">${fmtMin(b.s)}–${fmtMin(b.s+b.dur)}</b>`:""}</div>${short?"":`<b class="tr">${fmtMin(b.s)}–${fmtMin(b.s+b.dur)}</b>${b.note?`<em>${esc(b.note)}</em>`:""}`}

function handleLogo(file){
  logoError("");
  if(!file) return;
  if(!/^image\//.test(file.type || "")) return logoError("That file isn't an image. Choose a PNG, JPG, SVG or WebP.");
  if(file.size > 20*1024*1024) return logoError("That image is over 20 MB. Choose a smaller one.");
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const max = 192, nw = img.naturalWidth || max, nh = img.naturalHeight || max, r = Math.min(1, max / Math.max(nw, nh));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(nw*r)); c.height = Math.max(1, Math.round(nh*r));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    let data = ""; try { data = c.toDataURL("image/webp", 0.9); } catch(e) {}
    if(!data.startsWith("data:image/webp")) data = c.toDataURL("image/png");
    edit("settings", "logo", data); applyBrand(); renderMenu(); if(S.view==="cover") render(); toast("Logo updated");
  };
  img.onerror = () => { URL.revokeObjectURL(url); logoError("That image couldn't be opened. Try a PNG or JPG."); };
  img.src = url;
}

function decodePolyline(str){
  const pts = []; let i = 0, lat = 0, lng = 0;
  while(i < str.length){
    for(const k of [0, 1]){
      let res = 0, shift = 0, b;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while(b >= 32 && i <= str.length);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if(k === 0) lat += d; else lng += d;
    }

  }
  return pts;
}
function routeSvg(poly){

  const xy = pts.map(([la, lo]) => [lo * kx, -la]);
  const xs = xy.map(p => p[0]), ys = xy.map(p => p[1]), minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

  const P = xy.map(([x, y]) => [ox + (x - minX) * sc, oy + (y - minY) * sc]);
  const d = "M" + P.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L");
  const [s0, e0] = [P[0], P[P.length - 1]];
  return `<svg class="route" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route outline"><path d="${d}" class="rt-halo"/><path d="${d}" class="rt-line"/><circle cx="${s0[0].toFixed(1)}" cy="${s0[1].toFixed(1)}" r="7" class="rt-start"/><circle cx="${e0[0].toFixed(1)}" cy="${e0[1].toFixed(1)}" r="7" class="rt-end"/></svg>`;
}

/* ---------- Google Calendar start-up ---------- */
(async () => {
  try {
    if(!window.claude || !window.claude.use){ startDirect(); return; }
    const mcp = await window.claude.use("mcp");
    if(!mcp){ G.state = "unavailable"; paintG(); softRender(); return; }
    G.mcp = mcp; await gStart();
  } catch(e){ G.state = "unavailable"; paintG(); softRender(); }
})();

/* ---------- account sync ---------- */
(async () => {
  try {
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setStatus("Saved on this device only (sign in to sync)"); return; }
    DB = db.collection("data/users/" + uid);
    let first = true;
    DB.onSnapshot(snap => {
      let changed = false;
      if(first){
        const ids = new Set(snap.docs.map(d => d.id));
        [...store.keys()].forEach(k => { if(!ids.has(k) && !pending.has(k)){ store.delete(k); changed = true; } });
      }
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if(ch.doc.metadata.hasPendingWrites || pending.has(id)) return;
        if(ch.type==="removed") store.delete(id); else store.set(id, clone(ch.doc.data()));
        changed = true;
      });
      if(first){ first = false; [...pending].forEach(flush); if(!pending.size) setStatus("Synced", "ok"); }
      if(changed){ migrateWeeks(); migrateSched(); cacheLocal(); if(editing()) dirty = true; else render(); }
    }, () => setStatus("Sync stopped. Reload the page to reconnect.", "err"));
  } catch(e) { setStatus("Saved on this device only"); }
})();
})();
